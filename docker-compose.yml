## Example Docker Compose configuration
##
## Use this as a template to set up docker compose, or as guide to set up other
## orchestration services
services:

  server:
    build: server
    depends_on:
      - sql
    environment:
      ## These should be the names of the dependent containers listed below,
      ## or FQDNs/IP addresses if these services are running outside of Docker
      POSTGRES_HOST: sql
      ## Credentials for database:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      ## Commented Values are Default:
      #POSTGRES_DB: defaults to same as POSTGRES_USER
      #POSTGRES_PORT: 5432
      #LOG_SQL: 0 (1 for verbose SQL logs)
      THREADS:
    volumes:
      ## rslave propagation ensures that if the rclone (B2) FUSE mount at
      ## /var/local/szurubooru/data/posts is remounted/restarted on the host,
      ## the new mount propagates into this container instead of leaving it
      ## pinned to a dead FUSE connection ("Socket not connected" -> 500s).
      - type: bind
        source: /var/local/szurubooru/data
        target: /data
        bind:
          propagation: rslave
      - "./server/config.yaml:/opt/app/config.yaml"

  client:
    build: client
    depends_on:
      - server
    environment:
      BACKEND_HOST: server
      BASE_URL:
    volumes:
      ## Read-only, with rslave so host rclone remounts propagate in (see server).
      - type: bind
        source: "${MOUNT_DATA}"
        target: /data
        read_only: true
        bind:
          propagation: rslave
    ports:
      - "${PORT}:80"

  sql:
    image: postgres:11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
    volumes:
      - "${MOUNT_SQL}:/var/lib/postgresql/data"
